<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GEM フロストリポップ管理</title>

  <style>

    body {

      margin: 0;

      padding: 20px;

      background: #1e1e1e;

      color: white;

      font-family: sans-serif;
    }

    h1 {

      text-align: center;

      margin-bottom: 10px;
    }

    /* ===== 上部ボタン ===== */

    .top-buttons {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-bottom: 20px;
    }

    .top-buttons button {

      background: #3f51b5;

      border: none;

      color: white;

      padding: 10px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;
    }

    .top-buttons button:hover {

      opacity: 0.9;
    }

    /* ===== チャンネル ===== */

    .channels {

      display: grid;

      grid-template-columns: repeat(5, 1fr);

      gap: 12px;

      margin-bottom: 24px;
    }

    .channel {

      background: #2b2b2b;

      border-radius: 12px;

      padding: 12px;

      border: 1px solid #444;
    }

    .channel h2 {

      margin: 0 0 10px 0;

      text-align: center;

      font-size: 24px;
    }

    .buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      justify-content: center;

      margin-bottom: 10px;
    }

    button {

      border: none;

      border-radius: 8px;

      padding: 8px 10px;

      color: white;

      cursor: pointer;

      font-size: 13px;
    }

    .kill-btn {

      background: #4caf50;
    }

    .edit-btn {

      background: #ff9800;
    }

    .minus-btn {

      background: #607d8b;
    }

    button:hover {

      opacity: 0.9;
    }

    .time {

      text-align: center;

      line-height: 1.7;

      font-size: 16px;
    }

    .next {

      color: #ffd54f;

      font-weight: bold;
    }

    .remain {

      color: #87cefa;

      font-size: 20px;

      font-weight: bold;
    }

    .spawned {

      color: #ff5252;

      font-size: 24px;

      font-weight: bold;
    }

    /* ===== マップ ===== */

    .map-area {

      text-align: center;
    }

    .map-area img {

      width: 100%;

      max-width: 1200px;

      border-radius: 12px;

      border: 2px solid #555;
    }

    /* ===== スマホ ===== */

    @media (max-width: 1000px) {

      .channels {

        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {

      .channels {

        grid-template-columns: 1fr;
      }
    }

  </style>

</head>

<body>

  <h1>フロストリポップ管理</h1>

  <!-- ===== 上部ボタン ===== -->

  <div class="top-buttons">

    <button onclick="toggleSort()">

      リポップ順ソート

    </button>

  </div>

  <!-- ===== ch一覧 ===== -->

  <div
    class="channels"
    id="channels"
  ></div>

  <!-- ===== マップ ===== -->

  <div class="map-area">

    <img
      src="map.png"
      alt="マップ"
    >

  </div>

  <!-- ===== Firebase ===== -->

  <script type="module">

    import { initializeApp }

      from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {

      getFirestore,

      doc,

      setDoc,

      getDoc,

      onSnapshot

    }

      from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ===== Firebase設定 =====

    const firebaseConfig = {

      apiKey:
        "YOUR_API_KEY",

      authDomain:
        "YOUR_AUTH_DOMAIN",

      projectId:
        "YOUR_PROJECT_ID",

      storageBucket:
        "YOUR_STORAGE_BUCKET",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"
    };

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);

    // ===== =====

    const channelCount = 5;

    let sortMode = false;

    const initialTimes = {

      1: "2026-05-19T16:26",

      2: "2026-05-19T16:15",

      3: "2026-05-19T16:11",

      4: "2026-05-19T16:20",

      5: "2026-05-19T16:28"
    };

    const container =
      document.getElementById("channels");

    const channelData = {};

    // ===== ソート切替 =====

    window.toggleSort = function() {

      sortMode = !sortMode;

      updateAll();
    }

    // ===== ch生成 =====

function createChannels() {

  container.innerHTML = "";

  let list = [];

  for (
    let i = 1;
    i <= channelCount;
    i++
  ) {

    list.push(i);
  }

  // ソート時のみ並び替え

  if (sortMode) {

    list.sort((a, b) => {

      const aTime =
        channelData[a]
        ? new Date(channelData[a]).getTime()
        : 0;

      const bTime =
        channelData[b]
        ? new Date(channelData[b]).getTime()
        : 0;

      return aTime - bTime;
    });
  }

  for (const ch of list) {

    const div =
      document.createElement("div");

    div.className =
      "channel";

    div.innerHTML = `

      <h2>${ch}</h2>

      <div class="buttons">

        <button

          class="kill-btn"

          onclick="registerKill(${ch})"
        >

          討伐登録

        </button>

        <button

          class="edit-btn"

          onclick="editTime(${ch})"
        >

          修正

        </button>

        <button

          class="minus-btn"

          onclick="minusMinute(${ch}, 1)"
        >

          -1分

        </button>

        <button

          class="minus-btn"

          onclick="minusMinute(${ch}, 10)"
        >

          -10分

        </button>

      </div>

      <div

        class="time"

        id="time${ch}"

      >

        読み込み中...

      </div>
    `;

    container.appendChild(div);
  }
}

    // ===== 初期データ =====

    async function setupInitialData() {

      for (
        let i = 1;
        i <= channelCount;
        i++
      ) {

        const ref =

          doc(
            db,
            "boss",
            `ch${i}`
          );

        const snap =
          await getDoc(ref);

        if (!snap.exists()) {

          await setDoc(ref, {

            time:
              initialTimes[i]
          });
        }
      }
    }

    // ===== リアルタイム同期 =====

    function setupRealtime() {

      for (
        let i = 1;
        i <= channelCount;
        i++
      ) {

        const ref =

          doc(
            db,
            "boss",
            `ch${i}`
          );

        onSnapshot(ref, (snap) => {

          if (!snap.exists())
            return;

          channelData[i] =

            snap.data().time;

          createChannels();

          updateAll();
        });
      }
    }

    // ===== 討伐登録 =====

    window.registerKill =
      async function(ch) {

        const now =
          new Date();

        await setDoc(

          doc(
            db,
            "boss",
            `ch${ch}`
          ),

          {

            time:
              now.toISOString()
          }
        );
      }

    // ===== 修正 =====

    window.editTime =
      async function(ch) {

        const current =
          channelData[ch];

        const currentDate =
          new Date(current);

        const defaultValue =

          `${currentDate.getFullYear()}-`

          +

          `${String(

            currentDate.getMonth() + 1

          ).padStart(2, '0')}-`

          +

          `${String(

            currentDate.getDate()

          ).padStart(2, '0')}T`

          +

          `${String(

            currentDate.getHours()

          ).padStart(2, '0')}:`

          +

          `${String(

            currentDate.getMinutes()

          ).padStart(2, '0')}`;

        const input = prompt(

          "討伐時間を入力",

          defaultValue
        );

        if (!input)
          return;

        await setDoc(

          doc(
            db,
            "boss",
            `ch${ch}`
          ),

          {

            time:
              input
          }
        );
      }

    // ===== 分戻す =====

    window.minusMinute =
      async function(ch, min) {

        const current =
          channelData[ch];

        const date =
          new Date(current);

        date.setMinutes(

          date.getMinutes() - min
        );

        await setDoc(

          doc(
            db,
            "boss",
            `ch${ch}`
          ),

          {

            time:
              date.toISOString()
          }
        );
      }

    // ===== 更新 =====

    function updateAll() {

      for (
        let i = 1;
        i <= channelCount;
        i++
      ) {

        const saved =
          channelData[i];

        if (!saved)
          continue;

        const killTime =
          new Date(saved);

        const next =
          new Date(

            killTime.getTime()

            +

            6 * 60 * 60 * 1000
          );

        const now =
          new Date();

        const remainMs =
          next - now;

        let remainText =
          "";

        const tenMin =
          10 * 60 * 1000;

        if (

          remainMs > 0

          &&

          remainMs <= tenMin
        ) {

          remainText =

            `<span class="spawned">

              まもなく出現！

            </span>`;
        }

        else if (
          remainMs <= 0
        ) {

          remainText =

            `<span class="spawned">

              出現中！

            </span>`;
        }

        else {

          const h =
            Math.floor(

              remainMs

              /

              (1000 * 60 * 60)
            );

          const m =
            Math.floor(

              (

                remainMs

                %

                (
                  1000
                  * 60
                  * 60
                )

              )

              /

              (
                1000
                * 60
              )
            );

          const s =
            Math.floor(

              (

                remainMs

                %

                (
                  1000
                  * 60
                )

              )

              /

              1000
            );

          remainText =

            `<span class="remain">

              あと

              ${h}時間

              ${m}分

              ${s}秒

            </span>`;
        }

        const timeDiv =
          document.getElementById(
            `time${i}`
          );

        if (!timeDiv)
          continue;

        timeDiv.innerHTML = `

          討伐:

          ${formatDate(killTime)}

          <br>

          <span class="next">

            次回:

            ${formatDate(next)}

          </span>

          <br>

          ${remainText}
        `;
      }
    }

    // ===== 日時整形 =====

    function formatDate(date) {

      const month =

        String(

          date.getMonth() + 1

        ).padStart(2, '0');

      const day =

        String(

          date.getDate()

        ).padStart(2, '0');

      const hours =

        String(

          date.getHours()

        ).padStart(2, '0');

      const minutes =

        String(

          date.getMinutes()

        ).padStart(2, '0');

      return `

        ${month}/${day}

        ${hours}:${minutes}
      `;
    }

    // ===== 初期化 =====

    await setupInitialData();

    createChannels();

    setupRealtime();

    setInterval(
      updateAll,
      1000
    );

  </script>

</body>
</html>
