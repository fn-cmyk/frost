<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GEM フロストリポップ管理</title>

  <style>

    body {

      margin: 0;

      padding: 20px;

      background: #1e1e1e;

      color: white;

      font-family: sans-serif;
    }

    h1 {

      text-align: center;

      margin-bottom: 10px;
    }

    /* ===== 上部ボタン ===== */

    .top-buttons {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-bottom: 20px;
    }

    .top-buttons button {

      background: #3f51b5;

      border: none;

      color: white;

      padding: 10px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;
    }

    .top-buttons button:hover {

      opacity: 0.9;
    }

    /* ===== チャンネル ===== */

    .channels {

      display: grid;

      grid-template-columns: repeat(5, 1fr);

      gap: 12px;

      margin-bottom: 24px;
    }

    .channel {

      background: #2b2b2b;

      border-radius: 12px;

      padding: 12px;

      border: 1px solid #444;
    }

    .channel h2 {

      margin: 0 0 10px 0;

      text-align: center;

      font-size: 24px;
    }

    .buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      justify-content: center;

      margin-bottom: 10px;
    }

    button {

      border: none;

      border-radius: 8px;

      padding: 8px 10px;

      color: white;

      cursor: pointer;

      font-size: 13px;
    }

    .kill-btn {

      background: #4caf50;
    }

    .edit-btn {

      background: #ff9800;
    }

    .minus-btn {

      background: #607d8b;
    }

    button:hover {

      opacity: 0.9;
    }

    .time {

      text-align: center;

      line-height: 1.7;

      font-size: 16px;
    }

    .next {

      color: #ffd54f;

      font-weight: bold;
    }

    .remain {

      color: #87cefa;

      font-size: 20px;

      font-weight: bold;
    }

    .spawned {

      color: #ff5252;

      font-size: 24px;

      font-weight: bold;
    }

    /* ===== マップ ===== */

    .map-area {

      text-align: center;
    }

    .map-area img {

      width: 100%;

      max-width: 1200px;

      border-radius: 12px;

      border: 2px solid #555;
    }

    /* ===== スマホ ===== */

    @media (max-width: 1000px) {

      .channels {

        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {

      .channels {

        grid-template-columns: 1fr;
      }
    }
    
.map-area {

  position: relative;

  width: fit-content;

  margin: 0 auto;
}

.spot {

  position: absolute;

  width: clamp(28px, 4vw, 42px);

  height: clamp(28px, 4vw, 42px);
  
  border: 2px solid #FFFFFF;

  border-radius: 50%;

  font-size: clamp(12px, 2vw, 18px);
  
  font-family: "メイリオ" ;
  
  font-weight: bold;
  
  display: flex;
  
  justify-content: center;
  
  align-items: center;
  
  box-sizing: border-box;
  
  transform: translate(-50%, -50%);

}

/* 座標 */

.s1 {
  top: 46%;
  left: 24%;
  background: #EA3829;
}

.s2 {
  top: 36%;
  left: 31%;
  background: #F69500;
}
.s3 {
  top: 52%;
  left: 30%;
  background: #EF5A98;
}
.s4 {
  top: 46%;
  left: 40%;
  background: #AAD816;
}
.s5 {
  top: 58%;
  left: 40%;
  background: #27BB36;
}
.s6 {
  top: 46%;
  left: 49%;
  background: #7AB8F8;
}
.s7 {
  top: 38%;
  left: 58%;
  background: #686DF4;
}

.s8 {
  top: 50%;
  left: 58%;
  background: #0890BD;
}
.s9 {
  top: 44%;
  left: 67%;
  background: #CD3ACE;
}

.s10 {
  top: 60%;
  left: 66%;
  background: #A1C38C;
}
.s11 {
  top: 51%;
  left: 73%;
  background: #9A96BB;
}

.spot.checked {

  filter: brightness(0.4);

  opacity: 0.5;
}

.spot.found {

  animation: blink 1s infinite;

  border-color: white;
}

@keyframes blink {

  0% {

    transform: scale(1);

    filter: brightness(1);
    
    transform: translate(-50%, -50%);
  }

  50% {

    transform: scale(1.15);

    filter: brightness(1.8);
    
    transform: translate(-50%, -50%);
  }

  100% {

    transform: scale(1);

    filter: brightness(1);
    
    transform: translate(-50%, -50%);
  }
}

  </style>

</head>

<body>

  <h1>フロストリポップ管理</h1>

  <!-- ===== 上部ボタン ===== -->

  <div class="top-buttons">

    <button onclick="toggleSort()">

      次に湧く順

    </button>

  </div>

  <!-- ===== ch一覧 ===== -->

  <div
    class="channels"
    id="channels"
  ></div>

  <!-- ===== マップ ===== -->

  <div class="map-area">

    <img
      src="map.png"
      alt="マップ"
    >
    
  <button class="spot s1" onclick="toggleSpot(1)">
    1
  </button>

  <button class="spot s2" onclick="toggleSpot(2)">
    2
  </button>
  
  <button class="spot s3" onclick="toggleSpot(3)">
    3
  </button>

  <button class="spot s4" onclick="toggleSpot(4)">
    4
  </button>
  
  <button class="spot s5" onclick="toggleSpot(5)">
    5
  </button>

  <button class="spot s6" onclick="toggleSpot(6)">
    6
  </button>
  
  <button class="spot s7" onclick="toggleSpot(7)">
    7
  </button>

  <button class="spot s8" onclick="toggleSpot(8)">
    8
  </button>
  
  <button class="spot s9" onclick="toggleSpot(9)">
    9
  </button>

  <button class="spot s10" onclick="toggleSpot(10)">
    10
  </button>
  
  <button class="spot s11" onclick="toggleSpot(11)">
    11
  </button>

  </div>

  <!-- ===== Firebase ===== -->

  <script type="module">

    import { initializeApp }

      from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {

      getFirestore,

      doc,

      setDoc,

      getDoc,

      onSnapshot

    }

      from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ===== Firebase設定 =====

    const firebaseConfig = {

      apiKey:
        "AIzaSyAhY08YQBHf-J1ra5R6YTvQwgHWswOOQbs",

      authDomain:
        "gem-frost.firebaseapp.com",

      projectId:
        "gem-frost",

      storageBucket:
        "gem-frost.firebasestorage.app",

      messagingSenderId:
        "471453337459",

      appId:
        "1:471453337459:web:d7b793a007cc5ca1292706"
    };

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);

    // ===== =====

    const channelCount = 5;

    let sortMode = false;

    const initialTimes = {

      1: "2026-05-19T16:26",

      2: "2026-05-19T16:15",

      3: "2026-05-19T16:11",

      4: "2026-05-19T16:20",

      5: "2026-05-19T16:28"
    };

    const container =
      document.getElementById("channels");

    const channelData = {};
    
    const spotStates = {};

    // ===== ソート切替 =====

    window.toggleSort = function() {

      sortMode = !sortMode;
      	
      createChannels();

      updateAll();
    }

    // ===== ch生成 =====

function createChannels() {

  container.innerHTML = "";

  let list = [];

  for (
    let i = 1;
    i <= channelCount;
    i++
  ) {

    list.push(i);
  }

  // ソート時のみ並び替え

if (sortMode) {

  list.sort((a, b) => {

    const aNext =
      channelData[a]
      ? new Date(channelData[a]).getTime()
        + (6 * 60 * 60 * 1000)
      : Infinity;

    const bNext =
      channelData[b]
      ? new Date(channelData[b]).getTime()
        + (6 * 60 * 60 * 1000)
      : Infinity;

    return aNext - bNext;
  });
}

  for (const ch of list) {

    const div =
      document.createElement("div");

    div.className =
      "channel";

    div.innerHTML = `

      <h2>${ch}ch</h2>

      <div class="buttons">

        <button

          class="kill-btn"

          onclick="registerKill(${ch})"
        >

          討伐登録

        </button>

        <button

          class="edit-btn"

          onclick="editTime(${ch})"
        >

          修正

        </button>

        <button

          class="minus-btn"

          onclick="minusMinute(${ch}, 1)"
        >

          -1分

        </button>

        <button

          class="minus-btn"

          onclick="minusMinute(${ch}, 10)"
        >

          -10分

        </button>

      </div>

      <div

        class="time"

        id="time${ch}"

      >

        読み込み中...

      </div>
    `;

    container.appendChild(div);
  }
}

    // ===== 初期データ =====

    async function setupInitialData() {

      for (
        let i = 1;
        i <= channelCount;
        i++
      ) {

        const ref =

          doc(
            db,
            "boss",
            `ch${i}`
          );

        const snap =
          await getDoc(ref);

        if (!snap.exists()) {

          await setDoc(ref, {

            time:
              initialTimes[i]
          });
        }
      }
    }

    // ===== リアルタイム同期 =====

    function setupRealtime() {

      for (
        let i = 1;
        i <= channelCount;
        i++
      ) {

        const ref =

          doc(
            db,
            "boss",
            `ch${i}`
          );

        onSnapshot(ref, (snap) => {

          if (!snap.exists())
            return;

          channelData[i] =

            snap.data().time;

          createChannels();

          updateAll();
        });
      }
      
const spotRef =

  doc(
    db,
    "spots",
    "current"
  );

onSnapshot(spotRef, (snap) => {

  if (!snap.exists())
    return;

  Object.assign(
    spotStates,
    snap.data()
  );

  updateSpots();
});

    }

    // ===== 討伐登録 =====

    window.registerKill =
      async function(ch) {

        const now =
          new Date();

        await setDoc(

          doc(
            db,
            "boss",
            `ch${ch}`
          ),

          {

            time:
              now.toISOString()
          }
        );
        
        resetSpots();
        
      }
      
// 発見未発見リセット
async function resetSpots() {

  const resetData = {};

  for (
    let i = 1;
    i <= 11;
    i++
  ) {

    resetData[i] = "none";
  }

  await setDoc(

    doc(
      db,
      "spots",
      "current"
    ),

    resetData
  );
}

    // ===== 修正 =====

    window.editTime =
      async function(ch) {

        const current =
          channelData[ch];

        const currentDate =
          new Date(current);

        const defaultValue =

          `${currentDate.getFullYear()}-`

          +

          `${String(

            currentDate.getMonth() + 1

          ).padStart(2, '0')}-`

          +

          `${String(

            currentDate.getDate()

          ).padStart(2, '0')}T`

          +

          `${String(

            currentDate.getHours()

          ).padStart(2, '0')}:`

          +

          `${String(

            currentDate.getMinutes()

          ).padStart(2, '0')}`;

        const input = prompt(

          "討伐時間を入力",

          defaultValue
        );

        if (!input)
          return;

        await setDoc(

          doc(
            db,
            "boss",
            `ch${ch}`
          ),

          {

            time:
              input
          }
        );
      }

    // ===== 分戻す =====

    window.minusMinute =
      async function(ch, min) {

        const current =
          channelData[ch];

        const date =
          new Date(current);

        date.setMinutes(

          date.getMinutes() - min
        );

        await setDoc(

          doc(
            db,
            "boss",
            `ch${ch}`
          ),

          {

            time:
              date.toISOString()
          }
        );
      }

    // ===== 更新 =====

    function updateAll() {

      for (
        let i = 1;
        i <= channelCount;
        i++
      ) {

        const saved =
          channelData[i];

        if (!saved)
          continue;

        const killTime =
          new Date(saved);

        const next =
          new Date(

            killTime.getTime()

            +

            6 * 60 * 60 * 1000
          );

        const now =
          new Date();

        const remainMs =
          next - now;

        let remainText =
          "";

        const tenMin =
          10 * 60 * 1000;

        if (

          remainMs > 0

          &&

          remainMs <= tenMin
        ) {

          remainText =

            `<span class="spawned">

              まもなく出現！

            </span>`;
        }

        else if (
          remainMs <= 0
        ) {

          remainText =

            `<span class="spawned">

              出現中！

            </span>`;
        }

        else {

          const h =
            Math.floor(

              remainMs

              /

              (1000 * 60 * 60)
            );

          const m =
            Math.floor(

              (

                remainMs

                %

                (
                  1000
                  * 60
                  * 60
                )

              )

              /

              (
                1000
                * 60
              )
            );

          const s =
            Math.floor(

              (

                remainMs

                %

                (
                  1000
                  * 60
                )

              )

              /

              1000
            );

          remainText =

            `<span class="remain">

              あと

              ${h}時間

              ${m}分

              ${s}秒

            </span>`;
        }

        const timeDiv =
          document.getElementById(
            `time${i}`
          );

        if (!timeDiv)
          continue;

        timeDiv.innerHTML = `

          討伐:

          ${formatDate(killTime)}

          <br>

          <span class="next">

            次回:

            ${formatDate(next)}

          </span>

          <br>

          ${remainText}
        `;
      }
    }

    // ===== 日時整形 =====

    function formatDate(date) {

      const month =

        String(

          date.getMonth() + 1

        ).padStart(2, '0');

      const day =

        String(

          date.getDate()

        ).padStart(2, '0');

      const hours =

        String(

          date.getHours()

        ).padStart(2, '0');

      const minutes =

        String(

          date.getMinutes()

        ).padStart(2, '0');

      return `

        ${month}/${day}

        ${hours}:${minutes}
      `;
    }
    
// 発見未発見トグルボタン
window.toggleSpot =
  async function(num) {

    const current =
      spotStates[num] || "none";

    let next = "none";

    // 未探索 → 探索済み

    if (current === "none") {

      next = "checked";
    }

    // 探索済み → 発見

    else if (
      current === "checked"
    ) {

      next = "found";
    }

    // 発見 → 未探索

    else {

      next = "none";
    }

    // Firebase保存

    await setDoc(

      doc(
        db,
        "spots",
        "current"
      ),

      {

        [num]: next
      },

      {

        merge: true
      }
    );
}

function updateSpots() {

  for (
    let i = 1;
    i <= 11;
    i++
  ) {

    const spot =

      document.querySelector(
        `.s${i}`
      );

    if (!spot)
      continue;

    // 一旦全部消す

    spot.classList.remove(
      "checked"
    );

    spot.classList.remove(
      "found"
    );

    const state =
      spotStates[i];

    // 状態付与

    if (state === "checked") {

      spot.classList.add(
        "checked"
      );
    }

    else if (
      state === "found"
    ) {

      spot.classList.add(
        "found"
      );
    }
  }
}

    // ===== 初期化 =====

    await setupInitialData();

    createChannels();

    setupRealtime();

    setInterval(
      updateAll,
      1000
    );

  </script>

</body>
</html>
